[workspace]
resolver = "3"
members = ["crates/formats", "crates/vcl", "crates/platform", "crates/holiday"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
