[package]
name = "platform"
version = "0.1.0"
description = "Window, input and display for the Holiday Island port"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["audio-device"]
# Sound output through cpal (ALSA on Linux). Without it the game is silent.
audio-device = ["dep:cpal"]

[dependencies]
cpal = { version = "0.17", optional = true }
pollster = "1"
rustysynth = "1.3"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
# The shader's validation, with wgpu's own WGSL front end.
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
