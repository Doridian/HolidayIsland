[package]
name = "holiday"
version = "0.1.0"
description = "Holiday Island"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
formats = { path = "../formats" }
game = { path = "../game" }
net = { path = "../net" }
platform = { path = "../platform" }
vcl = { path = "../vcl" }
# `std::time` natively; the browser's clock on wasm, where `std::time`
# panics.
web-time = "1.1"

# The browser build (docs/web.md): the page's storage and its query.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The version of the wasm-bindgen CLI that builds the page
# (tools/build-web.sh): the two must match exactly.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Location", "Window"] }

[dev-dependencies]
# The network game's test runs the signaling server in the test.
server = { path = "../server" }
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[lints]
workspace = true
