# Holiday Island: the strings in German that aren't in a TEXTE\ or
# UPGRADE\ file (lang/README.md). UTF-8; the port shows them in the
# game's Windows-1252 font. Every key here is in every language's
# strings.toml.
#
# Where a value comes from: the German v1.0 HOLIDAY.EXE (addresses
# without a build) or the later build (`en` addresses), whose German
# texts the later build keeps for `land` D; the VCL's German string
# resources in v1.0's HOLIDAY.EXE; or the port itself ([port] and
# [enhance.*]). Typos are the original's: keep them.

[language]
# The language's own name.
name = "Deutsch"

[format]
# How the info bar, the news and the end forms write a date
# (`date_text`, en 1030:12b0, de 1030:0148): {day}, {suffix}, {month}
# (MONATE.TXT's) and {year}.
date = "{day}{suffix} {month} {year}"
# The suffix after the day: one for every day, or 31 separated by `|`
# (`land` D: CS:12ac).
day_suffixes = "."
# The thousands mark (`group_digits`, en 1030:2145) and the decimal mark
# of a price with pennies (`insert_decimal_marks`, en 1030:21f3).
thousands = "."
decimal = ","
# The high score table's date: Delphi's `DateToStr` (1008:0512), the
# short date format of a German Windows. dd, MM and yy are replaced.
highscore_date = "dd.MM.yy"
# The currency's name and factor aren't here: they're SONSTIGE.TXT's
# (`Waehrungsfaktor` and _TXTWaehrung_), DM times 10.

[msgdlg]
# The message boxes' captions: the VCL's string resources 0xf06f to
# 0xf072 (en `1118:4120`).
warning = "Warnung"
error = "Fehler"
information = "Information"
confirmation = "Bestätigen"
# Their buttons, `&` before the mnemonic: 0xf073 to 0xf07d (en `1118:4148`).
yes = "&Ja"
no = "&Nein"
ok = "&OK"
cancel = "&Abbruch"
abort = "Abbruch"
retry = "&Wiederholen"
ignore = "&Ignorieren"
all = "&Alles"
help = "&Hilfe"

[file_menu]
# A name that isn't a valid file name (`dateimenue_save`, en 1040:0eb0;
# v1.0 1040:0e03 has only this one).
invalid_name = "Dateiname ungültig"
# The question before "Löschen" erases a game (en 1040:10d7).
delete_question = "Wirklich loeschen?"

[news]
# An empty news archive entry's date (1048:1fc5). The world's: written
# into the archive and saved with it, in the world's language.
no_date = "kein Datum"
# NACHRICH.TXT's name for "no medium" (1048:0a45, 1048:1b39).
no_medium = "kein"

[computer]
# The computers' status texts (`1110:70f2`, 10a8:2cfa to 10a8:3026):
# the world's, saved in the map file, never on the screen. The same in
# both builds.
idle = "Gar nix"
thinking = "WLTNaechstenSchrittueberlegen"
demolishing = "WLTGebaeudeabreissen"
waiting = "WLTAbwarten"
selling = "WLTGebaeudeverkaufen"
nothing = "WLBNichtstun"
start_area = "WLBStartInselsuchen"
change_area = "WLBInselwechseln"
choose_category = "WLBGebaeudeartauswaehlen"
choose_type = "WLBGebaeudewaehlen"
find_road = "WLBGebaeudeBauPunktsuchen"
find_site = "WLBGebaeudeBauPunktsuchen2"
build = "WLBGebaeudebauen"
level = "WLBBauplatzebenmachen"
even_out = "WLBBauplatzhoeheausgleichen"
road = "WLBStrassebauen"
road_start = "WLBStrassenBauPunktsuchen"

[port]
# The port's own texts: the list of enhancements (crate::enhanceform).
enhance_title = "ERWEITERUNGEN"
enhance_fixes = "Spielkorrekturen"
enhance_view = "Anzeige und Ton"
enhance_fixes_note = "Für dieses Spiel und neue Spiele"
enhance_view_note = "Ihre Einstellungen für jedes Spiel"
enhance_all_on = "Alle an"
enhance_all_off = "Alle aus (Original)"
enhance_credits = "Mitwirkende"
enhance_saved = "Änderungen gelten sofort und werden in settings.ini gespeichert."
enhance_not_saved = "Änderungen gelten sofort, aber nur bis zum Beenden (keine settings.ini)."
enhance_command_line = "Beim nächsten Start gehen --original und --enhance wieder vor."
enhance_screen_off = "INFO zeigt nun die Mitwirkenden (zurück: enhance.enhancements_screen=on)."
enhance_hint = "Die Maus über einer Zeile zeigt hier, was sie ändert."
# The host's option for games with several players (crate::simulation).
auction_timeout = "Wartezeit der Auktion (Sekunden)"
auction_timeout_description = "Mit mehreren Spielern und \"Auktion wartet\": wie lange eine Auktion wartet, bis jeder Spieler sie gestartet oder gepasst hat. Wer dann nicht hat, gilt als ausgestiegen."
# A network game (docs/networking.md): its end for a client, the offer to
# save, and waiting for the host.
net_host_quit = "Der Gastgeber hat das Spiel beendet."
net_host_lost = "Die Verbindung zum Gastgeber ist abgebrochen, das Spiel ist zu Ende."
net_ended = "Das Netzwerkspiel ist beendet."
net_save_question = "Möchten Sie das Spiel speichern, wie es jetzt steht? Jeder kann es später als Gastgeber wieder starten."
net_waiting_host = "Warte auf das Spiel des Gastgebers ..."
net_host_dropped = "Die Verbindung zum Gastgeber ist unterbrochen. Warte auf ihn ..."

# The enhancements' short names and one-line descriptions, by their keys
# (crate::enhance).

[enhance.site_effect]
label = "Baustellenabriss nimmt Wirkung weg"
description = "Der Abriss einer Baustelle nimmt ihre Wirkung von der Lagekarte"

[enhance.bridge_demolition_cost]
label = "Brückenabriss im Meer kostet"
description = "Der Abriss einer Brücke im Meer kostet die Straßenabrisskosten je Feld, die das Original zusammenzählt, aber nie abbucht"

[enhance.price_class_range]
label = "Preisklasse nach Min- und Maxpreis"
description = "Die Preisklasse einer Einrichtung liegt zwischen MinPreis und MaxPreis, statt durch MaxPreis geteilt zu werden"

[enhance.ownerless_buildings]
label = "Herrenlose Gebäude zahlen an keinen"
description = "Gebäude von niemandem zahlen ihre Einnahmen, Kosten und Gäste nicht mehr in die Summen und Zinsen von Spieler 8"

[enhance.palm_removal]
label = "Tote Palmen werden abgezogen"
description = "Palmen, die sterben oder beim Planieren fallen, gehen von der Zählung ihres Grundstücks und von der Lagekarte ab"

[enhance.computer_area_change]
label = "Computer prüft das neue Gebiet"
description = "Ein Computer, der das Gebiet wechselt, prüft die Größe des neuen Grundstücks, nicht die des alten"

[enhance.computer_type_lists]
label = "Computer-Baulisten bleiben begrenzt"
description = "Die Baulisten der Computer enden bei 40 Typen je Kategorie, statt in die nächste zu laufen"

[enhance.ship_detour]
label = "Schiffe weichen richtig aus"
description = "Ein blockiertes Hafenschiff schaut beim zweiten Ausweichen auf die Felder vor sich, nicht auf sein eigenes"

[enhance.stage_spectators]
label = "Bühnen finden ihre Zuschauer"
description = "Bühnen suchen ihre Zuschauer dort, wo sie stehen, nicht auf dem ersten Feld der Bühne"

[enhance.plane_approach]
label = "Flugzeuge landen richtig"
description = "Beim zweiten Anflug eines Flugzeugs müssen beide Koordinaten stimmen, nicht nur eine"

[enhance.plot_merge_numbers]
label = "Grundstücke verschmelzen richtig"
description = "Land, das zwischen Grundstücken auftaucht, verschmilzt sie nach ihren ganzen Nummern, nicht auf ein Byte gekürzt"

[enhance.computer_road_ground]
label = "Computerstraßen nach eigenem Boden"
description = "Die Straßen der Computer richten sich nach dem Boden, auf dem sie beginnen, nicht nach der letzten Straße des Menschen"

[enhance.levelling_cliffs]
label = "Planieren ohne steilere Klippen"
description = "Planieren nimmt Nachbarn mit, die zwei oder mehr Stufen abweichen, damit vorhandene Klippen nicht steiler werden"

[enhance.levelling_errors]
label = "Planieren meldet den ersten Fehler"
description = "Heben und Senken melden den ersten Fehler, nicht ein späteres Gebäude oder das Geld"

[enhance.road_connections]
label = "Neue Straßen verbinden alle Gebäude"
description = "Eine neue Straße verbindet jedes Gebäude in der Nähe neu, nicht nur die, deren erstes Feld Teil 0 zeigt"

[enhance.nobodys_buildings]
label = "Infobox-Knöpfe nur für eigene Gebäude"
description = "Die Knöpfe der Infobox wirken nur auf die eigenen Gebäude, nicht auf die von niemandem"

[enhance.auction_computer_limit]
label = "Computer bieten nur im Limit"
description = "Ein Computer bietet bei einer Auktion nur, wenn sein Gebot in seinem Limit liegt, nicht nur der Preis"

[enhance.auction_pass]
label = "Passen lässt das Höchstgebot stehen"
description = "Passen bei einer Auktion lässt das Höchstgebot stehen und verkauft nach dem dritten Ruf nicht noch einmal"

[enhance.prize_player8]
label = "Spieler 8 bekommt Ersteigertes"
description = "Spieler 8 bekommt das Gebäude, das er ersteigert, wie die Spieler 2 bis 7"

[enhance.computer_bid_overflow]
label = "Computer-Limit ohne Überlauf"
description = "Das Auktionslimit eines reichen Computers läuft nicht mehr über"

[enhance.atoll_hills]
label = "Atoll-Hügel richtig verteilt"
description = "Die kleinen Hügel des Atolls liegen nach ihrer eigenen Streuung auf dem Ring, nicht nach der der großen"

[enhance.river_start]
label = "Flüsse entspringen nur auf Hügeln"
description = "Die Flüsse des Inselgenerators entspringen nur auf den Hügeln, nie im Flachen oder im Meer"

[enhance.generator_levelling]
label = "Inselbau: Flüsse ohne Klippen"
description = "Die Landänderungen des Inselgenerators werden bei einem Fehler zurückgenommen, so hinterlassen seine Flüsse keine Klippen"

[enhance.river_flat_way]
label = "Flüsse suchen nur bis zum Rand"
description = "Ein Fluss im Flachen sucht seinen Weg bis zum Kartenrand, nicht auf der anderen Seite herum"

[enhance.load_order]
label = "Laden behält die Reihenfolge"
description = "Laden behält die Baustellen und die Gebäudelisten der Grundstücke in ihrer gespeicherten Reihenfolge"

[enhance.sabotage_pool_error]
label = "Piranhas nur in Pools"
description = "Piranhas für ein Gebäude, das kein Pool ist, melden das, wie die anderen Sabotagearten"

[enhance.news_archive_order]
label = "Nachrichtenarchiv bleibt geordnet"
description = "Das Nachrichtenarchiv hält seine 26. und 27. Nachricht in der richtigen Reihenfolge, wenn es zum ersten Mal voll ist"

[enhance.tv_lights]
label = "Fernsehlichter ohne Spielzufall"
description = "Die blinkenden Lichter des Fernsehers nehmen nicht mehr die Zufallszahlen des Spiels, so ändert die Sprache das Spiel nicht"

[enhance.view_people]
label = "Jedem seine eigenen Leute"
description = "Zuschauer, Bauarbeiter, rollende Flugzeuge und Steg-Boote hat jeder Bildschirm selbst; die Leute der Welt folgen keiner Ansicht; aus: nur ein Spieler"

[enhance.shark_boat_count]
label = "Haitaucher zählt als Boot"
description = "Der Taucher des Hais zählt bei den Booten mit, so kommt kein Boot mehr dazu"

[enhance.saved_state]
label = "Spielstand speichert alles"
description = "Ein Spielstand behält auch Zufallszahlen, Ölpest, Auktion und Leute, so spielt ein geladenes Spiel genau weiter wie das gespeicherte"

[enhance.quake_pause]
label = "Erdbeben einmal pro Stunde"
description = "Ein Erdbeben richtet nur einmal pro Stunde Schaden an, nicht in jedem Takt, den das Spiel angehalten ist (Fernseher)"

[enhance.view_news]
label = "Nachrichten zur eigenen Ansicht"
description = "Nachrichten ohne Ort, der Rückweg des Fernsehers und die Ereignisse zu Pleiten und Vermögen nehmen die Ansicht jedes Spielers; aus: nur ein Spieler"

[enhance.computer_road_drag]
label = "Computer warten nicht auf Straßen"
description = "Die Computer bauen Straßen, während ein Mensch eine zieht, und ihre Straßen beenden das Ziehen nicht; aus: nur ein Spieler"

[enhance.overview_arrows]
label = "Übersichtspfeile lassen Leute"
description = "Die gehaltenen Pfeile der Übersichtskarte halten keine neuen Leute mehr auf; aus: nur ein Spieler"

[enhance.year_total]
label = "Jahressumme immer berechnet"
description = "Die Bücher rechnen die Summe des Jahres bei jeder Buchung aus, als wäre das Geldmenü immer offen; aus: nur ein Spieler"

[enhance.auction_speaker]
label = "Auktion wartet nicht auf TV"
description = "Eine Auktion beginnt, ohne auf den Sprecher des Fernsehers zu warten; aus: nur ein Spieler"

[enhance.sale_event_busy]
label = "Ein Verkauf nach dem anderen"
description = "Ein Gebäude (oder der Besitz eines Pleitegegangenen) kommt erst unter den Hammer, wenn der letzte Verkauf vorbei ist; sonst überschreibt er ihn"

[enhance.auction_queue]
label = "Auktionen warten aufeinander"
description = "Eine Auktion, die beginnt, während eine andere wartet oder läuft, kommt danach dran, statt deren Posten und Preis zu übernehmen"

[enhance.property_unsold]
label = "Unverkaufter Besitz wird geräumt"
description = "Den Besitz eines Pleitegegangenen, den kein Computer ersteigert, räumt die Auktion immer ab, nicht nur wenn kein Limit über dem Preis lag"

[enhance.sale_booked]
label = "Verkaufserlös in den Büchern"
description = "Der Erlös eines versteigerten Gebäudes steht in den Büchern des Verkäufers unter Sonstiges"

[enhance.soft_soap_active]
label = "Schmierseife endet wirklich"
description = "Nur Schmierseife, die noch wirkt, lässt Flugzeuge rutschen, nicht ihr Eintrag, der nach ihrem Ende Art und Feld behält"

[enhance.championship_location]
label = "Meisterschaft ohne Gebäude endet"
description = "Verschwindet das Gebäude einer Meisterschaft mittendrin, nimmt sie ihre Aufwertung der Lage zurück und endet"

[enhance.walker_markers]
label = "Fußgänger löschen nur ihre Marken"
description = "Ein Fußgänger, der ein Feld verlässt, löscht nur seine eigenen Marken darauf, nicht die eines anderen"

[enhance.bribe_no_effect]
label = "Bestechen ohne Wirkung kostenlos"
description = "Bestechen kostet nichts, wenn die Bauarbeiter nicht schneller werden können"

[enhance.window_stacking]
label = "Fenster stapeln wie unter Windows"
description = "Fenster stapeln sich wie unter Windows: ein Klick holt eines nach vorn (auch den Hauptschirm), nur modale bleiben oben"

[enhance.big_map]
label = "Großes Fenster zeigt mehr Insel"
description = "Ein größerer Bildschirm zeigt mehr Insel: der Hauptschirm füllt ihn und seine Karte wächst"

[enhance.scroll_bars]
label = "Bildlaufleisten wie unter Windows"
description = "Pfeile der Bildlaufleisten gehen beim Drücken einen Schritt und wiederholen; Schieber folgen der Maus; Blättern hält an der Maus"

[enhance.edit_field]
label = "Textfelder behalten den Fokus"
description = "Textfelder behalten beim Klicken den Fokus, so speichert Speichern im Dateimenü einen getippten Namen"

[enhance.modifier_clicks]
label = "Klicks auch mit Umschalt und Strg"
description = "Klicks auf Listen, mit Werkzeugen und auf Bildlaufleisten wirken auch mit Umschalt, Strg und Doppelklick; Pfeiltasten hält nur eine Maustaste auf"

[enhance.mouse_buttons]
label = "Nur die linke Maustaste klickt"
description = "Die rechte Maustaste klickt keine Startmenüknöpfe mehr, hakt keine Optionen an, zieht kein Geldmenü, schließt keine Mitwirkenden und rollt nicht die Übersichtskarte"

[enhance.start_menu_scenario]
label = "Startmenü hakt das Szenario an"
description = "Die Szenarioseite des Startmenüs hakt das Szenario an, das starten wird"

[enhance.auction_title]
label = "Auktionstitel springt nicht"
description = "Der Titel des Auktionsfensters springt nach einem Klick auf seine Titelleiste nicht eine Zeile hoch"

[enhance.form_positions]
label = "Fenster öffnen am richtigen Platz"
description = "Fenster öffnen, wo sie hingehören: die Auktion mittig, das Geldmenü ganz, die anderen über dem Hauptschirm"

[enhance.saved_games_order]
label = "Spielstände nach Namen sortiert"
description = "Die Listen der Spielstände sind nach Namen sortiert, nicht rückwärts"

[enhance.road_drag]
label = "Straße endet beim Loslassen"
description = "Eine gezogene Straße endet dort, wo die Maus losgelassen wird, auch ohne Animationen"

[enhance.tool_follows_mouse]
label = "Bauumriss folgt der Maus"
description = "Der Umriss dessen, was ein Werkzeug baut oder abreißt, folgt der Maus, nicht nur zehnmal pro Sekunde"

[enhance.build_menu]
label = "Baumenü gibt Tasten weiter"
description = "Das Baumenü gibt die Tasten weiter, die es nicht braucht, und macht geschlossen kein Schließgeräusch"

[enhance.money_menu_button]
label = "Jahresbilanz drückt den Geldknopf"
description = "Der Jahreswechsel drückt den Knopf des Geldmenüs, wenn er das Menü öffnet"

[enhance.overview_scrolling]
label = "Übersichtskarte scrollt richtig"
description = "Klicks auf die Übersichtskarte halten den Hauptschirm in seinen Bildlaufleisten; ihr Schieber bleibt vom Pfeil weg"

[enhance.overview_colours]
label = "Übersichtskarte zeigt alle Farben"
description = "Die Übersichtskarte hat eine Farbe für niedriges Gras, hohen Sand und Gebäude von niemandem statt keiner"

[enhance.form_drags]
label = "Fensterziehen endet beim Loslassen"
description = "Fensterziehen endet, wenn die Maus losgelassen wird, und bewegt nur das gefasste Fenster; Hauptschirm, Baumenü, Dateimenü und die Abfrage zum Beenden bleiben ganz im Bild"

[enhance.infobox_text]
label = "Infobox: Tausenderpunkte und Meer"
description = "Die Infobox setzt die Tausenderpunkte an die richtige Stelle und nennt außerhalb der Karte das Meer"

[enhance.infobox_size]
label = "Infobox passt ihre Größe an"
description = "Die Infobox wächst oder schrumpft nach einem Knopf auf das, was sie zeigt"

[enhance.overview_list]
label = "Gebäudeübersicht scrollt richtig"
description = "Die Gebäudeübersicht hält die Auswahl mit Auf und Ab im Blick und zeichnet ihren Preis sauber"

[enhance.tv_form]
label = "Fernsehknöpfe wie gedacht"
description = "Die Knöpfe, der Zurückknopf und der Titel des Fernsehers wirken wie gedacht, und Blättern lässt ihn offen"

[enhance.desktop_background]
label = "Hintergrundbild für jede Größe"
description = "Jede Fenstergröße bekommt das nächste Hintergrundbild, mittig, und an den Rändern wird nichts abgeschnitten"

[enhance.auction_calls]
label = "Der Auktionator ist zu hören"
description = "Die drei Rufe des Auktionators sind zu hören"

[enhance.sound_times]
label = "Geräusche auch ohne Animationen"
description = "Geräusche spielen nach ihrer Zeit auch ohne Animationen wieder"

[enhance.music]
label = "Musik ohne Pausen, auch nach Laden"
description = "Die Musik beginnt beim ersten Stück der Liste, hat keine Pausen zwischen den Stücken und spielt nach dem Laden weiter"

[enhance.tv_sound]
label = "Fernsehton passt zur Nachricht"
description = "Die Sprache des Fernsehers gehört zu ihrer Nachricht, und seine Filme lassen die Geräusche nicht stumm oder auf Sprachlautstärke"

[enhance.enhancements_screen]
label = "INFO zeigt diese Liste"
description = "Der INFO-Knopf der Optionen öffnet diese Liste der Erweiterungen (die Mitwirkenden sind einen Knopf entfernt)"

[enhance.no_main_title]
label = "Kein zweiter Titelbalken"
description = "Füllt der Hauptschirm das Fenster, fällt seine eigene Titelleiste weg; die Karte bekommt den Platz"

[enhance.mouse_wheel]
label = "Mausrad scrollt"
description = "Das Mausrad scrollt die Insel (mit Umschalt quer), die Übersichtskarte und die Listen"

[enhance.people_everywhere]
label = "Leute auf der ganzen Insel"
description = "Mit jedem seinen eigenen Leuten kommen die Leute des Bildschirms auf der ganzen Insel, nicht nur wo die Ansicht ist"

[enhance.quake_screen]
label = "Erdbeben nach dem Laden"
description = "Ein mitten im Erdbeben geladenes Spiel merkt sich den Platz des Hauptschirms, so stellt das Ende des Bebens ihn dorthin zurück"

[enhance.saved_windows]
label = "Gespeicherte Fenster passen"
description = "Die Fenster eines geladenen Spiels bleiben, wo sie über dem Hauptschirm waren, und ganz auf dem Bildschirm, wie groß er beim Speichern auch war"

[enhance.loaded_forms]
label = "Keine leeren Fenster nach dem Laden"
description = "Das Laden zeigt das Spielende, die Infobox und den Tooltip nicht wieder, die es nicht füllen kann"

[enhance.loaded_pause]
label = "Keine Pause nach dem Laden"
description = "Ein mit offenem Fernseher gespeichertes Spiel lädt nicht angehalten ohne Fernseher: das Laden beendet dessen Pause"

[enhance.overview_frame]
label = "Übersichtsrahmen passt gedreht"
description = "Der Rahmen der Übersichtskarte hat bei um eine Vierteldrehung gedrehter Ansicht deren Form, etwa 50 x 20, statt immer 40 x 25"

[enhance.auction_paddle]
label = "Kelle löscht die Hand nicht"
description = "Die Hand des Auktionators wird nach jedem Bild einer Bieterkelle neu gezeichnet, statt unten abgeschnitten zu werden"
