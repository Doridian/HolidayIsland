name: build

# The port for Linux (x86-64, arm64), Windows (x86-64), macOS (universal)
# and the browser, on every push and pull request, each one file: an
# AppImage, an .exe, the app in a .dmg (docs/packages.md). None carries game
# data: the player gives the port the CD image (or the game's folder) at run
# time, natively from a file dialog when it isn't given (`pick`), in the
# browser on the page. A push to main also deploys the page to GitHub Pages
# (docs/web.md); a tag v* publishes every package on the tag's release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The AppImages are built on the oldest Ubuntu the runners have: they
    # run where the system's glibc is as new as the build's or newer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config file

      - name: Build
        run: cargo build --release --locked -p holiday

      - name: Package (AppImage)
        timeout-minutes: 10
        run: |
          out=holiday-island-linux-${{ matrix.arch }}.AppImage
          curl -sSLfo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage
          chmod +x linuxdeploy
          doc=AppDir/usr/share/doc/holiday-island
          mkdir -p $doc
          cp LICENSE README.md $doc/
          cp crates/holiday/res/icon.png holiday-island.png
          # the window, the GPU and the sound are the host's (dlopen'd, or
          # linuxdeploy's excludelist: libasound, libGL, libvulkan)
          LDAI_OUTPUT=$out ./linuxdeploy --appdir AppDir -e target/release/holiday \
              -d crates/holiday/res/holiday-island.desktop -i holiday-island.png --output appimage
          # (it starts: the libraries are all there)
          { ./$out --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v7
        with:
          name: holiday-island-linux-${{ matrix.arch }}
          path: holiday-island-linux-${{ matrix.arch }}.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # the C runtime linked in: the .exe needs only Windows' own DLLs
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p holiday

      - name: Package
        run: |
          cp target/release/holiday.exe holiday-island-windows-x86_64.exe
          # (it starts)
          { ./holiday-island-windows-x86_64.exe --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v7
        with:
          name: holiday-island-windows-x86_64
          path: holiday-island-windows-x86_64.exe

  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 and x86-64)
        run: |
          cargo build --release --locked -p holiday --target aarch64-apple-darwin
          cargo build --release --locked -p holiday --target x86_64-apple-darwin

      - name: Package (app in a dmg)
        timeout-minutes: 10
        run: |
          app="dmg/Holiday Island.app"
          c="$app/Contents"
          mkdir -p "$c/MacOS" "$c/Resources"
          lipo -create -output "$c/MacOS/holiday" \
              target/aarch64-apple-darwin/release/holiday target/x86_64-apple-darwin/release/holiday
          v=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac
          sed "s/@VERSION@/$v/" crates/holiday/res/Info.plist > "$c/Info.plist"
          # the icon, from crates/holiday/res/icon.png
          mkdir holiday-island.iconset
          for n in 16 32 128 256 512; do
              sips -z $n $n crates/holiday/res/icon.png --out holiday-island.iconset/icon_${n}x${n}.png > /dev/null
              if [ $n -le 256 ]; then
                  sips -z $((n * 2)) $((n * 2)) crates/holiday/res/icon.png --out holiday-island.iconset/icon_${n}x${n}@2x.png > /dev/null
              fi
          done
          iconutil -c icns holiday-island.iconset -o "$c/Resources/holiday-island.icns"
          cp LICENSE README.md "$c/Resources/"
          otool -L "$c/MacOS/holiday"
          lipo -info "$c/MacOS/holiday"
          codesign --force --deep -s - "$app"
          # (it starts)
          { "$c/MacOS/holiday" --help 2>&1 || true; } | grep "usage:"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Holiday Island" -srcfolder dmg -ov -format UDZO holiday-island-macos.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: holiday-island-macos
          path: holiday-island-macos.dmg

  # The browser build (docs/web.md), without game data: the page asks the
  # player for their CD image. crates/holiday/web/front.html is the front
  # page, holiday.html the game next to it.
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: The wasm-bindgen version the crates pin
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/holiday/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: tools/build-web.sh --out web

      - name: Assemble the site
        run: |
          # The site must never carry game data, only the port's own files.
          if find web -type f ! -name '*.js' ! -name '*.wasm' ! -name '*.html' | grep .; then
            echo "unexpected files in the build"; exit 1
          fi
          mkdir _site
          cp -r web/holiday.js web/holiday_bg.wasm web/snippets _site/
          cp web/index.html _site/holiday.html
          cp crates/holiday/web/front.html _site/index.html
          d=holiday-island-web
          cp -r _site $d
          cp LICENSE README.md $d/
          zip -r $d.zip $d

      - uses: actions/upload-artifact@v7
        with:
          name: holiday-island-web
          path: holiday-island-web.zip

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
