# Publishes the browser build (docs/web.md) on GitHub Pages, without game
# data: the page asks the player for their CD image (the German CD from
# archive.org). crates/holiday/web/front.html is the front page,
# holiday.html the game next to it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: The wasm-bindgen version the crates pin
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/holiday/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: tools/build-web.sh --out web

      - name: Assemble the site
        run: |
          # The site must never carry game data, only the port's own files.
          if find web -type f ! -name '*.js' ! -name '*.wasm' ! -name '*.html' | grep .; then
            echo "unexpected files in the build"; exit 1
          fi
          mkdir _site
          cp -r web/holiday.js web/holiday_bg.wasm web/snippets _site/
          cp web/index.html _site/holiday.html
          cp crates/holiday/web/front.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
